name: Release

# Release-Fluss: Git-Tag v* baut und pusht Images nach GHCR — aber NUR, wenn zuvor
# Tests, Lint und ein Trivy-Scan grün sind (Quality-Gate, docs/11 Abschnitt 4).
# Der Commit-Stand landet als Build-Arg im Frontend-Footer und als OCI-Label an beiden Images.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  gate:
    name: Quality-Gate (Tests, Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend verify (inkl. RLS-Isolations- und Flow-Tests)
        working-directory: backend
        run: mvn -B -ntp verify

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, lint, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  backend-image:
    name: Backend-Image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurz-SHA ermitteln
        id: vars
        run: echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (lokal, fuer Scan)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: opencrm-backend:scan

      - name: Trivy-Scan (blockt bei CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: opencrm-backend:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencrm-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opencrm-backend:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  frontend-image:
    name: Frontend-Image
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kurz-SHA ermitteln
        id: vars
        run: echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (lokal, fuer Scan)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          build-args: |
            VITE_GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: opencrm-frontend:scan

      - name: Trivy-Scan (blockt bei CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: opencrm-frontend:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencrm-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opencrm-frontend:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
