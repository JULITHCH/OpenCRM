# OpenCRM Frontend — Nginx-Konfiguration fuer den non-root Betrieb auf Port 8080.
# Ersetzt /etc/nginx/nginx.conf vollstaendig (kein include conf.d, damit die
# Default-Site auf Port 80 nicht mitlaeuft).
#
# Security-Header laut docs/11-deployment-und-betrieb.md Abschnitt 9;
# Cache-Regeln laut Abschnitt 3.1 (Assets mit Hash: immutable, index.html: no-cache).

worker_processes auto;

# non-root: PID- und Temp-Pfade muessen ausserhalb von /run bzw. /var/cache liegen
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    # non-root: Temp-Pfade nach /tmp verlegen
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hinweis add_header-Vererbung: sobald ein location-Block ein eigenes
    # add_header setzt, verwirft Nginx ALLE geerbten add_header-Direktiven.
    # Die Security-Header sind deshalb in jedem location-Block wiederholt.

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Probe-Endpunkt (Liveness/Readiness im Deployment)
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 'ok';
        }

        # Gehashte Build-Assets: aggressiv und unveraenderlich cachen
        location /assets/ {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA-Fallback: alle unbekannten Pfade liefern index.html (Client-Routing)
        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # TODO: vollstaendige CSP (default-src eigene Origins + Keycloak-Host,
            # docs/11 Abschnitt 9) je Umgebung ergaenzen; frame-ancestors 'none'
            # ersetzt X-Frame-Options.
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
