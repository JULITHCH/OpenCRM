apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencrm.fullname" . }}-frontend
  labels:
    {{- include "opencrm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "opencrm.selectorLabels" (dict "root" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
