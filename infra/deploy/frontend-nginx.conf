# OpenCRM Frontend — Nginx fuer den Single-Host-Betrieb (infra/deploy).
# Serviert die SPA UND proxyt /api an das Backend im selben Compose-Netz, damit
# Frontend und API dieselbe Origin haben (das Backend erlaubt bewusst kein CORS).
# TLS terminiert der vorgelagerte Nginx-Proxy; hier laeuft nur HTTP auf 8080.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploads bis 50 MB (Import-Dateien, docs/08)
    client_max_body_size 55m;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 'ok';
        }

        # API an das Backend im Compose-Netz durchreichen (gleiche Origin -> kein CORS noetig)
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Gehashte Build-Assets: aggressiv und unveraenderlich cachen
        location /assets/ {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA-Fallback: alle unbekannten Pfade liefern index.html (Client-Routing)
        location / {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
