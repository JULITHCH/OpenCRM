# Beispiel-Konfiguration fuer den VORGELAGERTEN Nginx-Reverse-Proxy (auf dem
# LXC-Host oder davor). TLS wird HIER terminiert; der OpenCRM-Stack laeuft intern
# auf HTTP (LXC:8080 = App, LXC:8081 = Keycloak).
#
# LXC_IP durch die IP/den Hostnamen des LXC-Containers ersetzen (z. B. 10.0.0.50).
# Zertifikate z. B. via certbot; Pfade anpassen.

upstream opencrm_app {
    server LXC_IP:8080;
}
upstream opencrm_auth {
    server LXC_IP:8081;
}

# --- App: crm.example.com ------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    client_max_body_size 55m;   # Import-Uploads bis 50 MB

    location / {
        proxy_pass http://opencrm_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Keycloak: auth.example.com ------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    location / {
        proxy_pass http://opencrm_auth;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name crm.example.com auth.example.com;
    return 301 https://$host$request_uri;
}
